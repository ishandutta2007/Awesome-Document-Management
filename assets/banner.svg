<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-1.5deg); }
      }
      @keyframes wave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.9; }
        100% { opacity: 0.4; }
      }
      
      .bg-orb1 { animation: pulse 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .bg-orb2 { animation: pulse 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .float-card1 { animation: float1 6s ease-in-out infinite; }
      .float-card2 { animation: float2 7s ease-in-out infinite 1s; }
      .wave-line { stroke-dasharray: 20, 15; animation: wave 30s linear infinite; }
      .shimmer-text { animation: shimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="bg-orb1" cx="200" cy="100" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle class="bg-orb2" cx="1000" cy="300" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)"/>

  <!-- Animated Tech Waves & Grid Pattern in Background -->
  <g opacity="0.15">
    <path class="wave-line" d="M -100 80 Q 300 200 700 80 T 1500 80" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path class="wave-line" d="M -100 280 Q 400 150 800 320 T 1500 200" fill="none" stroke="#c084fc" stroke-width="2"/>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Background Decorative Floating Pill Cards (positioned in background behind main text) -->
  <g class="float-card1" opacity="0.45" filter="url(#shadow)">
    <rect x="80" y="60" width="160" height="44" rx="22" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1"/>
    <text x="160" y="87" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📄 OCR &amp; Indexing</text>
  </g>

  <g class="float-card2" opacity="0.45" filter="url(#shadow)">
    <rect x="960" y="70" width="170" height="44" rx="22" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1"/>
    <text x="1045" y="97" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔒 Self-Hosted EDMS</text>
  </g>

  <g class="float-card2" opacity="0.4" filter="url(#shadow)">
    <rect x="100" y="295" width="170" height="44" rx="22" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1"/>
    <text x="185" y="322" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Content Cloud</text>
  </g>

  <g class="float-card1" opacity="0.4" filter="url(#shadow)">
    <rect x="930" y="290" width="190" height="44" rx="22" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="1025" y="317" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🌐 Data Sovereignty</text>
  </g>

  <!-- Foreground Main Content Container -->
  <g filter="url(#shadow)">
    <!-- Top Accent Badge -->
    <rect x="475" y="65" width="250" height="32" rx="16" fill="url(#accent-grad)"/>
    <text x="600" y="86" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">ENTERPRISE CONTENT &amp; EDMS</text>

    <!-- Main Title -->
    <text x="600" y="175" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Document Management
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="225" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
      Curated Directory of Cloud SaaS, Self-Hosted EDMS, Paperless Archiving &amp; Open-Source Stacks
    </text>

    <!-- Accent Divider Line -->
    <rect x="450" y="255" width="300" height="3" rx="1.5" fill="url(#accent-grad)"/>

    <!-- Bottom Highlights -->
    <text x="600" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">
      Modern Content Governance • Metadata Schemas • OCR • Digital Signing • Privacy Sovereign
    </text>
  </g>
</svg>
